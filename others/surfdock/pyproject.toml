[project]
name = "eff-dock-external-surfdock"
version = "0.0.0"
description = "Isolated SurfDock inference environment for EFF-Dock benchmarking"
requires-python = ">=3.10,<3.11"
dependencies = [
  "accelerate==0.15.0",
  "biopandas==0.4.1",
  "biopython==1.79",
  "dimorphite-dl @ git+https://github.com/Sulstice/dimorphite_dl.git@ee006cc6344ca57b71777e99853014f38a816cf5",
  "e3nn==0.5.1",
  "fair-esm @ git+https://github.com/facebookresearch/esm.git@2b369911bb5b4b0dda914521b9475cad1656b2ac",
  "huggingface-hub==0.17.3",
  "ipython==8.37.0",
  "loguru==0.7.2",
  "mdanalysis==2.4.0",
  "networkx==3.2",
  "numpy==1.24.4",
  "openmm==8.1.1",
  "pandas==2.1.2",
  "plyfile==1.0.1",
  "posebusters==0.2.13",
  "prefetch-generator==1.0.3",
  "pymesh2 @ https://github.com/nuvolos-cloud/PyMesh/releases/download/v0.3.1/pymesh2-0.3.1-cp310-cp310-linux_x86_64.whl",
  "pyyaml==6.0.1",
  "rdkit==2023.3.1",
  "scikit-learn==1.3.2",
  "scipy==1.8.1",
  "setuptools==80.9.0",
  "spyrmsd==0.7.0",
  "tokenizers==0.13.3",
  "torch==2.2.2",
  "torch-cluster==1.6.3+pt22cu121",
  "torch-geometric==2.5.2",
  "torch-scatter==2.1.2+pt22cu121",
  "torch-sparse==0.6.18+pt22cu121",
  "torch-spline-conv==1.2.2+pt22cu121",
  "torch-ema==0.3",
  "torchaudio==2.2.2",
  "torchvision==0.17.2",
  "tqdm==4.66.4",
  "transformers==4.29.2",
  "wandb==0.16.1",
]

[tool.uv]
package = false
link-mode = "copy"
find-links = ["https://data.pyg.org/whl/torch-2.2.0+cu121.html"]
override-dependencies = ["rdkit-pypi; python_version < '3.0'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
