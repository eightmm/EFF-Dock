model:
  model_type: unified
  hidden_dim: 384
  hidden_vec_dim: 32
  l2_dim: 16
  l2o_dim: 16
  num_layers: 6
  n_rbf: 32
  t_emb_dim: 128
  sh_lmax: 2
  dropout: 0.1
  contact_cutoff: 5.0

data:
  data_dir: data/plinder_processed
  split_file: data/splits/plinder.json

  min_atoms: 5
  max_atoms: 120
  max_frags: 30
  min_protein_res: 50

  pocket_cutoff: 8.0
  pocket_jitter_sigma: 2.0
  pocket_cutoff_noise: 0.0
  prior_sigma: 0.5
  pocket_cutoff_range: [6.0, 12.0]
  prior_sigma_values: [0.5, 1.0, 2.0, 3.0, 4.0]
  prior_sigma_weights: [0.10, 0.25, 0.30, 0.25, 0.10]
  prior_sigma_range: null
  prior_sigma_log_uniform: true

  # Short fine-tune distribution:
  #   80% retained SimpleFold late-biased distribution
  #   10% U(0, 0.3)
  #   10% exact t=0
  # Validation loss stays on the retained distribution for comparability.
  time_distribution: simplefold_early_replay
  time_early_replay_weights: [0.80, 0.10, 0.10]
  time_early_replay_max: 0.30
  val_time_distribution: simplefold

  rotation_augmentation: ligand_uniform
  deterministic: false
  num_workers: 4
  receptor_aug_prob: 0.0
  alt_receptor_root: data/plinder_processed/_alt_proteins
  alt_receptor_mapping: data/plinder_processed/alt_receptor_mapping.json

training:
  max_steps: 2000
  batch_size: 16
  gradient_accumulation_steps: 1
  size_aware_batches: true
  size_aware_bucket_mult: 16
  use_muon: false
  muon_lr: 0.02
  lr: 2.0e-5
  weight_decay: 0.01
  omega_weight: 8.0
  atom_aux_weight: 0.3
  dg_weight: 3.0
  max_grad_norm: 1.0
  scheduler_type: warmup_stable_cosine
  warmup_ratio: 0.05
  cooldown_ratio: 0.50
  min_lr_ratio: 0.10
  seed: 42
  use_ema: true
  ema_decay: 0.999
  use_time_weighting: false
  fail_on_nonfinite: true

logging:
  use_wandb: false
  wandb_project: eff-dock
  wandb_run_name: effdock-early-time-ft-t0p10-v1
  log_every: 10
  val_every: 500
  rollout_every: 500
  eval_on_start: true
  rollout_steps: 20
  rollout_time_schedule: uniform
  rollout_schedule_power: 1.0
  rollout_max_samples: 256
  rollout_progress_every: 16
  output_dir: outputs/eff-dock/early-time-ft-t0p10-v1-retry1-20260813
