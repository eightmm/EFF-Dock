[project]
name = "eff-dock-external-sigmadock"
version = "0.0.0"
description = "Isolated SigmaDock inference environment for EFF-Dock benchmarking"
requires-python = ">=3.12,<3.13"
dependencies = [
  "biopython==1.88",
  "e3nn==0.6.0",
  "esm==3.2.3",
  "hydra-core==1.3.5",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "omegaconf==2.3.1",
  "posebusters==0.6.5",
  "pytorch-lightning==2.6.5",
  "rdkit==2026.3.5",
  "scipy==1.18.1",
  "spyrmsd==0.9.0",
  "torch==2.13.0",
  "torch-geometric==2.8.0.post1",
  "torchvision==0.28.0",
  "tqdm==4.70.0",
  "wandb==0.29.0",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
