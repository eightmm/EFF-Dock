[project]
name = "eff-dock-external-diffbindfr"
version = "0.0.0"
description = "Isolated DiffBindFR inference environment for EFF-Dock benchmarking"
requires-python = ">=3.9,<3.10"
dependencies = [
  "addict==2.4.0",
  "biopython==1.80",
  "deepsmiles==1.0.1",
  "dm-tree==0.1.8",
  "e3nn==0.5.1",
  "easydict==1.10",
  "einops==0.5.0",
  "fcd-torch==1.0.7",
  "filelock==3.9.0",
  "gpustat>=1,<2",
  "joblib==1.3.2",
  "lmdb==1.4.1",
  "matplotlib>=3.7,<3.9",
  "mdanalysis>=2.4,<2.7",
  "mdtraj>=1.9,<2",
  "meeko==0.5.0",
  "ml-collections==0.1.1",
  "networkx>=2.8,<3",
  "numba>=0.58,<0.61",
  "numpy==1.26.4",
  "omegaconf>=2.3,<3",
  "openbabel-wheel>=3.1.1,<4",
  "opencv-python>=4.8,<5",
  "pandarallel==1.6.3",
  "pandas>=1.5,<2.1",
  "pint>=0.20,<1",
  "posebusters>=0.3,<0.4",
  "prefetch-generator==1.0.3",
  "prettytable==3.6.0",
  "prody<=2.4.0",
  "py3dmol==2.0.4",
  "python-constraint @ git+https://github.com/python-constraint/python-constraint.git@f1359ff0ff6d9a541923d071cf1c0b50f8e8925b",
  "rdkit==2023.3.2",
  "requests>=2.28,<3",
  "scikit-learn==1.4.1.post1",
  "scipy==1.12.0",
  "seaborn>=0.12,<0.14",
  "selfies>=2,<3",
  "setuptools==80.9.0",
  "spyrmsd==0.5.2",
  "tensorboard>=2.12,<2.18",
  "tensorboardx>=2.6,<3",
  "torch==1.13.1+cu117",
  "torch-cluster==1.6.0+pt113cu117",
  "torch-geometric==2.2.0",
  "torch-scatter==2.1.0+pt113cu117",
  "torch-sparse==0.6.16+pt113cu117",
  "torch-spline-conv==1.2.1+pt113cu117",
  "torchmetrics==0.11.0",
  "torchtyping==0.1.5",
  "tqdm>=4.64,<5",
  "typeguard==2.13.3",
  "typing-extensions==4.5.0",
  "wandb==0.13.3",
  "yapf==0.32.0",
]

[tool.uv]
package = false
link-mode = "copy"
find-links = ["https://data.pyg.org/whl/torch-1.13.1+cu117.html"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.extra-build-dependencies]
prody = ["numpy==1.26.4", "cython<3"]

[tool.uv.sources]
torch = { index = "pytorch-cu117" }

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
